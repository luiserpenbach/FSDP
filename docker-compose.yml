services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fsdp
      POSTGRES_USER: fsdp
      POSTGRES_PASSWORD: ${FSDP_DB_PASSWORD:-fsdp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsdp -d fsdp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      FSDP_DATABASE_URL: postgresql+psycopg://fsdp:${FSDP_DB_PASSWORD:-fsdp}@db:5432/fsdp
      FSDP_SECRET_KEY: ${FSDP_SECRET_KEY:-dev-insecure-secret-key-change-me}
      FSDP_SESSION_COOKIE_SECURE: ${FSDP_SESSION_COOKIE_SECURE:-false}
      FSDP_ADMIN_EMAIL: ${FSDP_ADMIN_EMAIL:-}
      FSDP_ADMIN_PASSWORD: ${FSDP_ADMIN_PASSWORD:-}
      FSDP_ADMIN_NAME: ${FSDP_ADMIN_NAME:-FSDP Admin}
      FSDP_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FSDP_WEB_PORT:-8080}:80"

volumes:
  postgres-data:
