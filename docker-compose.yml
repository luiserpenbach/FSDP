services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fsdp
      POSTGRES_USER: fsdp
      POSTGRES_PASSWORD: fsdp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsdp -d fsdp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
